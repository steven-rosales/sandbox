services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
      POSTGRES_DB: ds
    ports:
      - "5555:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d ds"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ds-postgres:/var/lib/postgresql

volumes:
  ds-postgres:
